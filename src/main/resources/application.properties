
spring.application.name=StayHub

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_booking_db
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api/v1

jwt.secretKey = YOUR_SECRET_KEY
jwt.expiration = 86400000
frontend.url=http://localhost:8080
stripe.secret.key=YOUR_SECRET_KEY
stripe.webhook.secret=YOUR_WEBHOOK_SECRET
